{% extends "base.html" %}

{% block title %}Page Not Found (404){% endblock %}
{% block page_title %}Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-12 col-md-8 col-lg-6 text-center">
    <div class="panel-dark py-5">
      <div style="font-size: 64px; color: var(--panel-muted); margin-bottom: 16px;">
        <i class="bi bi-question-circle"></i>
      </div>
      <h2 style="color: #FFFFFF; font-size: 28px; margin-bottom: 12px;">404 - Page Not Found</h2>
      <p style="color: var(--panel-muted); margin-bottom: 28px; font-size: 16px;">
        The page or invoice you are looking for does not exist or has been moved.
      </p>
      <a href="{{ url_for('dashboard') }}" class="btn-shelf btn-primary-shelf">
        <i class="bi bi-house-door"></i>
        <span>Return to Dashboard</span>
      </a>
    </div>
  </div>
</div>
{% endblock %}
